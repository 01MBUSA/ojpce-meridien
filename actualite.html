<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actualité | OJPCE/MERIDIEN</title>
<link rel="stylesheet" href="css/style.css">
<style>
.article-page{max-width:980px;margin:40px auto;padding:0 20px}
.article-image{width:100%;min-height:320px;background-position:center;background-size:cover;border-radius:14px;margin:25px 0}
.article-meta{font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.article-content{font-size:1.08rem;line-height:1.8;white-space:pre-wrap}
.article-back{display:inline-block;margin-top:25px}
.article-error{text-align:center;padding:60px 20px}
</style>
</head>
<body>
<header><div class="container">
<a href="index.html" class="logo">OJPCE/MERIDIEN</a>
<a class="admin-login" href="https://ojpce-meridien-admin.netlify.app/admin/" aria-label="Connexion administrateur" title="Connexion administrateur"><span aria-hidden="true">↪</span></a>
</div></header>
<main class="article-page" id="article"><p>Chargement de l’actualité…</p></main>
<script>
const esc=value=>String(value??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const asset=value=>{if(!value)return"";if(/^https?:\/\//i.test(value))return value;return value.startsWith("/")?value:"/"+value};
const article=document.getElementById("article");
const id=Number(new URLSearchParams(location.search).get("id"));
fetch("content/actualites.json?v="+Date.now()).then(r=>{if(!r.ok)throw Error("load");return r.json()}).then(data=>{
const item=(data.items||[])[id];
if(!item){article.innerHTML='<div class="article-error"><h1>Actualité introuvable</h1><a class="article-back" href="actualites.html">← Retour aux actualités</a></div>';return;}
article.innerHTML=`<span class="article-meta">${esc(item.category)}</span><h1>${esc(item.title)}</h1>${item.date?`<p><strong>${esc(item.date)}</strong></p>`:""}${item.image?`<div class="article-image" style="background-image:url('${esc(asset(item.image))}')"></div>`:""}${item.excerpt?`<p><strong>${esc(item.excerpt)}</strong></p>`:""}<div class="article-content">${esc(item.body||item.excerpt||"").replace(/\n/g,"<br>")}</div><a class="article-back" href="actualites.html">← Retour aux actualités</a>`;
}).catch(()=>{article.innerHTML='<div class="article-error"><h1>Erreur de chargement</h1><p>Veuillez réessayer plus tard.</p><a class="article-back" href="actualites.html">← Retour aux actualités</a></div>';});
</script>
</body>
</html>
